[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lisa_packs*", "lisa_packs.coding*"]

[tool.setuptools.package-data]
"lisa_packs.coding" = ["modes/**/*.md", "tools/**/*.yml"]

[project]
name = "lisa-pack-coding"
version = "0.1.0"
description = "Provider-neutral local coding workflow tools for Lisa"
requires-python = ">=3.11"
dependencies = ["lisa-harness-kernel", "lisa-harness-sdk"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "lisa-harness-packstest",
]

[tool.pytest.ini_options]
markers = [
    "live: hits real external signal or provider APIs and prints a tester-visible summary",
    "integration: multi-module in-process test; may require local services",
    "eval: deterministic tool-workflow regressions (no model calls; local Git and sandbox I/O)",
]

[project.entry-points."lisa.extensions.content_roots"]
coding = "lisa_packs.coding:get_content_root"

[project.entry-points."lisa.extensions.host_commands"]
coding-copilot = "lisa_packs.coding.copilot_commands:get_host_commands"

[project.entry-points."lisa.extensions.sandbox_floors"]
coding = "lisa_packs.coding.sandbox:floor_contribution"
