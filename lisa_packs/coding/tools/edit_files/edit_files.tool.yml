tool_id: coding_edit_files
pack_id: lisa-pack-coding
description: "Validate bounded exact text edits, then apply them as one Git patch to an owned worktree. Submit edits as an array of records, each shaped {kind: update|create|delete, path, expected_sha256, replacements: [{old_text, new_text}]} — kind 'update' needs expected_sha256 (current complete-file SHA-256 digest) plus non-empty replacements; kind 'create' needs content; kind 'delete' needs only expected_sha256. Every old_text must match exactly once in the original file snapshot, and replacement spans must not overlap; replacement order does not matter. Content and trailing newlines are preserved exactly as supplied. Submit the array directly as edits, not as a JSON-encoded string, and put path, kind, and expected_sha256 inside every record — never as arguments-level fields. Use this preferred edit tool instead of manually calculating unified-diff hunk counts."
exportable: true
effect: write
approval_required: true
approval_preview: "apply bounded exact edits to the owned worktree"
history:
  scope: turn
  invalidates:
    - "coding.read:{artifact_id}:{edits[].path}@-:"
    # An auto-rebase stales working-tree reads of every path upstream changed
    # (result-only, so it fires even when the edit then fails).
    - "coding.read:{result.artifact_id}:{result.sync.upstream_paths[]}@-:"
    - "coding.verify:{artifact_id}"
    - "coding.status:{artifact_id}"
    # Only working-tree diffs; branch/trees/commit diffs are pinned to SHAs.
    - "coding.diff:{artifact_id}:working_tree:"
    - "coding.diff:{artifact_id}:staged:"
    - "coding.diff:{artifact_id}:unstaged:"
