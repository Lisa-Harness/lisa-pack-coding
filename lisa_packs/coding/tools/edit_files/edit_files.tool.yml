tool_id: coding_edit_files
pack_id: lisa-pack-coding
description: "Validate bounded exact text edits, then apply them as one Git patch to an owned worktree. Each record carries its own kind and path: update = path + expected_sha256 + replacements [{old_text, new_text}]; create = path + content; delete = path + expected_sha256. expected_sha256 is the complete current-file SHA-256 from the latest coding_read_file — never invented or reused after a write; every old_text matches exactly once and spans must not overlap. edits is a JSON array of records (never a string or object, and never arguments-level path/expected_sha256)."
exportable: true
effect: write
approval_required: true
approval_preview: "apply bounded exact edits to the owned worktree"
validation_recovery:
  content_path: tools/edit_files/recovery.md
history:
  scope: turn
  invalidates:
    - "coding.read:{artifact_id}:{edits[].path}@-:"
    # An auto-rebase stales working-tree reads of every path upstream changed
    # (result-only, so it fires even when the edit then fails).
    - "coding.read:{result.artifact_id}:{result.sync.upstream_paths[]}@-:"
    - "coding.verify:{artifact_id}"
    - "coding.status:{artifact_id}"
    # Only working-tree diffs; branch/trees/commit diffs are pinned to SHAs.
    - "coding.diff:{artifact_id}:working_tree:"
    - "coding.diff:{artifact_id}:staged:"
    - "coding.diff:{artifact_id}:unstaged:"
