description: "Import one already-merged upstream commit into an owned coding worktree: coding_create_worktree must have created it with the same import_commit, the worktree base must be that commit's parent, and the commit's diff (full-index/binary, --unidiff-zero) is applied as one patch revision that clears checks. Cannot re-import the same commit before a commit or patch export; paths in generated directories and empty commits are rejected. Prefer fresh work over imports."
