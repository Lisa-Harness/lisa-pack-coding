tool_id: coding_apply_patch
pack_id: lisa-pack-coding
description: "Prevalidate and apply an existing bounded unified diff inside an owned worktree. Prefer coding_edit_files for ordinary text changes; use this tool as the unified-diff fallback. The patch must contain --- a/path and +++ b/path headers and numbered @@ -old_start,old_count +new_start,new_count @@ hunks with accurate line counts. Do not use *** Begin Patch, *** Update File, or unnumbered @@ hunks. If rejected, inspect the current file and submit a corrected unified diff; do not repeat the unchanged patch."
exportable: true
effect: write
approval_required: true
approval_preview: "apply a bounded patch to the owned worktree"
history:
  scope: turn
  invalidates:
    - "coding.read:{artifact_id}:{result.changed_paths[]}@-:"
    # An auto-rebase stales working-tree reads of every path upstream changed
    # (result-only, so it fires even when the edit then fails).
    - "coding.read:{result.artifact_id}:{result.sync.upstream_paths[]}@-:"
    - "coding.verify:{artifact_id}"
    - "coding.status:{artifact_id}"
    # Only working-tree diffs; branch/trees/commit diffs are pinned to SHAs.
    - "coding.diff:{artifact_id}:working_tree:"
    - "coding.diff:{artifact_id}:staged:"
    - "coding.diff:{artifact_id}:unstaged:"
