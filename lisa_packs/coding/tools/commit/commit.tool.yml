tool_id: coding_commit
pack_id: lisa-pack-coding
description: "Verify (upstream sync, preparation, fix and required checks, reusing unchanged passes) and then commit an owned feature worktree. Refuses with the failing check output when a required check fails."
exportable: true
effect: write
approval_required: true
approval_preview: "commit the checked owned worktree revision"
# Commit runs the full verification first; each check bounds itself, so the
# wrapper self-bounds (sdk/AUTHORING.md).
timeout_seconds: 0
history:
  key: "coding.verify:{artifact_id}"
  invalidates:
    - "coding.status:{artifact_id}"
    # An auto-rebase stales working-tree reads of every path upstream changed
    # (result-only, so it fires even when the commit then fails).
    - "coding.read:{result.artifact_id}:{result.verification.sync.upstream_paths[]}@-:"
    # Only working-tree diffs; branch/trees/commit diffs are pinned to SHAs.
    - "coding.diff:{artifact_id}:working_tree:"
    - "coding.diff:{artifact_id}:staged:"
    - "coding.diff:{artifact_id}:unstaged:"
